
name: EliMatic HQ agent tick

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Run due agent jobs
        env:
          HQ_FUNCTION_URL: ${{ secrets.HQ_FUNCTION_URL }}
          HQ_CRON_SECRET: ${{ secrets.HQ_CRON_SECRET }}
        run: |
            test -n "$HQ_FUNCTION_URL" && test -n "$HQ_CRON_SECRET"
            printf '%s' '{"action":"tick"}' | curl --fail-with-body --max-time 120 -X POST "$HQ_FUNCTION_URL" -H "Content-Type: application/json" -H "x-hq-cron: $HQ_CRON_SECRET" --data-binary @-
